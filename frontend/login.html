<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login – Smart Learn</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body style="background: #f1f5f9; display: flex; flex-direction: column; min-height: 100vh;">

  <!-- Navigation Bar -->
  <nav class="navbar">
    <div class="nav-container">
      <a href="index.html" class="brand-logo">
        <i class="fas fa-brain"></i> Smart Learn
      </a>
      <ul class="nav-links">
        <li><a href="index.html" class="nav-link">Home</a></li>
        <li><a href="signup.html" class="btn btn-outline btn-sm">Sign Up</a></li>
      </ul>
    </div>
  </nav>

  <!-- Login Form Container -->
  <main class="main-content" style="display: flex; align-items: center; justify-content: center; padding: 3rem 1.5rem;">
    <div class="card" style="width: 100%; max-width: 440px; padding: 2.5rem; border-radius: var(--radius-lg);">
      
      <div style="text-align: center; margin-bottom: 2rem;">
        <div style="width: 60px; height: 60px; background: var(--primary-light); color: var(--primary); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.6rem; margin: 0 auto 1rem;">
          <i class="fas fa-sign-in-alt"></i>
        </div>
        <h2 style="font-size: 1.8rem; font-weight: 800;">Welcome Back</h2>
        <p style="color: var(--text-muted); font-size: 0.95rem;">Log in to access your Smart Learn dashboard</p>
      </div>

      <div id="alert-container"></div>

      <form id="login-form">
        <div class="form-group">
          <label class="form-label" for="email">Email Address</label>
          <input type="email" id="email" class="form-control" placeholder="student@example.com" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <input type="password" id="password" class="form-control" placeholder="••••••••" required>
        </div>

        <button type="submit" id="submit-btn" class="btn btn-primary" style="width: 100%; padding: 0.85rem; font-size: 1rem; margin-top: 1rem;">
          <i class="fas fa-sign-in-alt"></i> Log In
        </button>
      </form>

      <div style="text-align: center; margin-top: 1.8rem; font-size: 0.95rem; color: var(--text-muted);">
        Don't have an account? <a href="signup.html" style="font-weight: 700;">Sign up free</a>
      </div>
    </div>
  </main>

  <footer class="footer">
    <p>&copy; 2026 Smart Learn – AI-Powered Learning Assistant.</p>
  </footer>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // Redirect if already logged in
      if (getToken()) {
        window.location.href = 'dashboard.html';
      }

      const loginForm = document.getElementById('login-form');
      const alertContainer = document.getElementById('alert-container');
      const submitBtn = document.getElementById('submit-btn');

      loginForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        alertContainer.innerHTML = '';

        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;

        if (!email || !password) {
          alertContainer.innerHTML = `<div class="alert alert-danger"><i class="fas fa-exclamation-circle"></i> Please fill in all fields.</div>`;
          return;
        }

        try {
          submitBtn.disabled = true;
          submitBtn.innerHTML = `<div class="spinner"></div> Logging in...`;

          const data = await apiRequest('/api/auth/login', 'POST', { email, password }, false);
          
          setToken(data.access_token);
          setUser(data.user);
          
          showToast('Login successful! Redirecting...', 'success');
          setTimeout(() => {
            window.location.href = 'dashboard.html';
          }, 800);
        } catch (err) {
          alertContainer.innerHTML = `<div class="alert alert-danger"><i class="fas fa-exclamation-circle"></i> ${err.message}</div>`;
        } finally {
          submitBtn.disabled = false;
          submitBtn.innerHTML = `<i class="fas fa-sign-in-alt"></i> Log In`;
        }
      });
    });
  </script>
</body>
</html>
