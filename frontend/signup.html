<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up – Smart Learn</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body style="background: #f1f5f9; display: flex; flex-direction: column; min-height: 100vh;">

  <!-- Navigation Bar -->
  <nav class="navbar">
    <div class="nav-container">
      <a href="index.html" class="brand-logo">
        <i class="fas fa-brain"></i> Smart Learn
      </a>
      <ul class="nav-links">
        <li><a href="index.html" class="nav-link">Home</a></li>
        <li><a href="login.html" class="btn btn-outline btn-sm">Log In</a></li>
      </ul>
    </div>
  </nav>

  <!-- Signup Form Container -->
  <main class="main-content" style="display: flex; align-items: center; justify-content: center; padding: 3rem 1.5rem;">
    <div class="card" style="width: 100%; max-width: 480px; padding: 2.5rem; border-radius: var(--radius-lg);">
      
      <div style="text-align: center; margin-bottom: 2rem;">
        <div style="width: 60px; height: 60px; background: var(--primary-light); color: var(--primary); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.6rem; margin: 0 auto 1rem;">
          <i class="fas fa-user-plus"></i>
        </div>
        <h2 style="font-size: 1.8rem; font-weight: 800;">Create Account</h2>
        <p style="color: var(--text-muted); font-size: 0.95rem;">Join Smart Learn and personalize your study journey</p>
      </div>

      <div id="alert-container"></div>

      <form id="signup-form">
        <div class="form-group">
          <label class="form-label" for="name">Full Name</label>
          <input type="text" id="name" class="form-control" placeholder="Alex Student" required minlength="2">
        </div>

        <div class="form-group">
          <label class="form-label" for="email">Email Address</label>
          <input type="email" id="email" class="form-control" placeholder="student@example.com" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <input type="password" id="password" class="form-control" placeholder="At least 6 characters" required minlength="6">
        </div>

        <div class="form-group">
          <label class="form-label" for="confirm-password">Confirm Password</label>
          <input type="password" id="confirm-password" class="form-control" placeholder="Repeat password" required minlength="6">
        </div>

        <button type="submit" id="submit-btn" class="btn btn-primary" style="width: 100%; padding: 0.85rem; font-size: 1rem; margin-top: 1rem;">
          <i class="fas fa-user-check"></i> Create Account
        </button>
      </form>

      <div style="text-align: center; margin-top: 1.8rem; font-size: 0.95rem; color: var(--text-muted);">
        Already have an account? <a href="login.html" style="font-weight: 700;">Log in here</a>
      </div>
    </div>
  </main>

  <footer class="footer">
    <p>&copy; 2026 Smart Learn – AI-Powered Learning Assistant.</p>
  </footer>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      if (getToken()) {
        window.location.href = 'dashboard.html';
      }

      const signupForm = document.getElementById('signup-form');
      const alertContainer = document.getElementById('alert-container');
      const submitBtn = document.getElementById('submit-btn');

      signupForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        alertContainer.innerHTML = '';

        const name = document.getElementById('name').value.trim();
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;
        const confirm_password = document.getElementById('confirm-password').value;

        if (password !== confirm_password) {
          alertContainer.innerHTML = `<div class="alert alert-danger"><i class="fas fa-exclamation-circle"></i> Passwords do not match.</div>`;
          return;
        }

        try {
          submitBtn.disabled = true;
          submitBtn.innerHTML = `<div class="spinner"></div> Creating Account...`;

          const data = await apiRequest('/api/auth/signup', 'POST', {
            name, email, password, confirm_password
          }, false);

          setToken(data.access_token);
          setUser(data.user);

          showToast('Account created successfully! Welcome to Smart Learn.', 'success');
          setTimeout(() => {
            window.location.href = 'dashboard.html';
          }, 800);
        } catch (err) {
          alertContainer.innerHTML = `<div class="alert alert-danger"><i class="fas fa-exclamation-circle"></i> ${err.message}</div>`;
        } finally {
          submitBtn.disabled = false;
          submitBtn.innerHTML = `<i class="fas fa-user-check"></i> Create Account`;
        }
      });
    });
  </script>
</body>
</html>
